<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>✊ Rock Paper Scissors ✋</h1>
        <p class="subtitle">Play against the computer!</p>

        <div class="choices">
            <button class="choice" data-choice="rock">
                ✊ Rock
            </button>

            <button class="choice" data-choice="paper">
                ✋ Paper
            </button>

            <button class="choice" data-choice="scissors">
                ✌️ Scissors
            </button>
        </div>

        <div class="result">
            <p>Your Choice: <span id="player-choice">-</span></p>

            <p>Computer's Choice:
                <span id="computer-choice">-</span>
            </p>

            <h2 id="result-message">Choose your move!</h2>
        </div>

        <div class="scoreboard">

            <div class="score-box">
                <h3>Your Score</h3>
                <p id="player-score">0</p>
            </div>

            <div class="score-box">
                <h3>Computer</h3>
                <p id="computer-score">0</p>
            </div>

            <div class="score-box">
                <h3>Draws</h3>
                <p id="draw-score">0</p>
            </div>

        </div>

        <button id="reset-btn">🔄 Reset Game</button>

        <footer>
            Built with HTML, CSS and JavaScript
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
